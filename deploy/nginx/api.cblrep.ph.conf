# =============================================================================
# CBLREP · api.cblrep.ph  — nginx server block
# =============================================================================
#
# One host serves BOTH:
#   • the Laravel JSON API        ->  https://api.cblrep.ph/api/*
#   • the React admin console     ->  https://api.cblrep.ph/login  and
#                                     https://api.cblrep.ph/admin/*
#
# The admin console is a single-page app whose routes are already absolute
# (/login, /admin/...), so it is served from the host root with an index.html
# fallback. The API is namespaced under /api/ and delegated to PHP-FPM.
#
# Paths assume the layout in backend/deploy/DEPLOY_DEBIAN.md:
#   /var/www/cblrep/backend     (Laravel app; document root = backend/public)
#   /var/www/cblrep/frontend    (React app; built to frontend/dist)
#
# Install:
#   sudo cp api.cblrep.ph.conf /etc/nginx/sites-available/api.cblrep.ph.conf
#   sudo ln -s /etc/nginx/sites-available/api.cblrep.ph.conf \
#              /etc/nginx/sites-enabled/api.cblrep.ph.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.cblrep.ph       # then re-run: sudo nginx -t
#
# Note on HTTP/2: `http2 on;` needs nginx >= 1.25.1. On older nginx replace it
# with the classic directive `listen 443 ssl http2;` (and drop the separate
# `http2 on;` line).
# =============================================================================

# --- HTTP: only to answer the ACME challenge, then redirect to HTTPS ---------
server {
    listen 80;
    listen [::]:80;
    server_name api.cblrep.ph;

    # certbot writes its challenge tokens here (see the runbook).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.cblrep.ph;

    # Let's Encrypt (certbot --nginx manages these; paths exist after issuance).
    ssl_certificate     /etc/letsencrypt/live/api.cblrep.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cblrep.ph/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Listing photos / verification documents are uploaded through the API.
    client_max_body_size 12M;

    # Laravel application root: holds index.php and the public/storage symlink.
    root /var/www/cblrep/backend/public;
    index index.php;

    # Never serve dotfiles (.env, .git, ...) over the web.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Media served straight from the public disk (Laravel storage:link).
    location /storage/ {
        try_files $uri =404;
    }

    # JSON API — routed through Laravel's front controller.
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # React admin console (SPA). Absolute routes /login and /admin/* live here;
    # any unknown path falls back to index.html so a hard refresh never 404s.
    location / {
        root /var/www/cblrep/frontend/dist;
        try_files $uri /index.html;
    }

    # Content-hashed Vite bundles are immutable — cache them hard.
    location /assets/ {
        root /var/www/cblrep/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM. Keep the socket name in sync with the installed PHP version
    # (`ls /run/php/`); this runbook pins PHP 8.3.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    access_log /var/log/nginx/cblrep.access.log;
    error_log  /var/log/nginx/cblrep.error.log;
}
