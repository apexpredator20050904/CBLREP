# ─────────────────────────────────────────────────────────────────────────────
# Deploy console — the React admin console to Vercel
# ─────────────────────────────────────────────────────────────────────────────
# A push to main redeploys the console. The API is delivered by deploy.yml;
# the two are separate because they are separate machines.
#
# Vercel cannot run PHP-FPM, so the console calls the API cross-origin and
# the API has to allow this origin — backend/config/cors.php carries the
# *.vercel.app pattern for exactly that.
#
# The API origin is a repository VARIABLE, not a secret and not a file: flip
# VERCEL_API_BASE_URL and the next push moves the console to another API
# without a code change.
#
# Secrets:  VERCEL_TOKEN
# Variables: VERCEL_PROJECT, VERCEL_API_BASE_URL, and VERCEL_ORG (only for a
#            team account — a personal token needs no scope).
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy console

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deployment at a time.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy the console
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
          VERCEL_ORG: ${{ vars.VERCEL_ORG }}
          API_BASE_URL: ${{ vars.VERCEL_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT" ]; then
            # Vercel is not wired to this repository yet. Say so and stop,
            # rather than failing every push — but once the token IS set, a
            # broken deployment fails loudly.
            echo "::notice::Vercel is not wired to this repository — nothing was deployed."
            exit 0
          fi
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::VERCEL_API_BASE_URL is not set — the console would call a relative /api and 404."
            exit 1
          fi

          cd frontend
          SCOPE=""
          if [ -n "$VERCEL_ORG" ]; then SCOPE="--scope $VERCEL_ORG"; fi

          # Link to the existing project. The project's own settings carry the
          # root directory (frontend) and the SPA rewrite, so the console's
          # /admin/* routes survive a hard refresh.
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" $SCOPE

          # The API origin is inlined into the bundle AT BUILD TIME, so it is
          # a project environment variable. --force makes this idempotent.
          npx --yes vercel@latest env add VITE_API_BASE_URL production \
            --value "$API_BASE_URL" --force --yes --token "$VERCEL_TOKEN" $SCOPE

          npx --yes vercel@latest --prod --yes --token "$VERCEL_TOKEN" $SCOPE
